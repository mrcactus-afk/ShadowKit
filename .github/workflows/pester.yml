name: ShadowKit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Pester Tests
        shell: powershell
        run: |
          Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser
          .\tests\Run-Tests.ps1
